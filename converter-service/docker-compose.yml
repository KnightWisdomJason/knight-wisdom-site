services:
  knightwisdom-converter:
    build: .
    container_name: knightwisdom-converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONVERTER_PORT:-8090}:8090"
    environment:
      CONVERTER_SIGNING_SECRET: ${CONVERTER_SIGNING_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://knightwisdom.com}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
